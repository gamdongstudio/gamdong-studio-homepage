<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갤러리 | 감동사진관 광명</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-header></div>

<section class="page-hero plain">
  <div class="container hero-text" style="text-align:center">
    <span class="eyebrow">GALLERY</span>
    <h1 style="font-size:clamp(32px,5vw,50px)">갤러리</h1>
    <p style="color:var(--ink-soft);margin-top:12px">감동사진관에서 촬영한 사진들입니다. 사진을 누르면 크게 볼 수 있어요.</p>
  </div>
</section>

<section class="section" style="padding-top:48px">
  <div class="container">
    <div class="filters">
      <button class="on" data-f="all">전체</button>
      <button data-f="family">가족사진</button>
      <button data-f="id">증명·여권</button>
      <button data-f="profile">프로필</button>
    </div>

    <!-- 사진 추가 방법: 아래 한 묶음(<div class="g-item"> ~ </div>)을 복사해서 사진 파일 이름만 바꾸면 됩니다.
         data-cat 은 family(가족) / id(증명) / profile(프로필) 중 하나로 적어주세요. -->
    <div class="gallery">
      <div class="g-item" data-cat="family" data-full="images/family-big.jpg" data-caption="3대 대가족 사진">
        <img src="images/family-big.jpg" alt="3대 대가족 사진" loading="lazy"><span class="cap">가족사진</span>
      </div>
      <div class="g-item" data-cat="profile" data-full="images/profile-couple.jpg" data-caption="커플 프로필">
        <img src="images/profile-couple.jpg" alt="커플 프로필" loading="lazy"><span class="cap">프로필</span>
      </div>
      <div class="g-item" data-cat="family" data-full="images/family-four.jpg" data-caption="4인 가족사진">
        <img src="images/family-four.jpg" alt="4인 가족사진" loading="lazy"><span class="cap">가족사진</span>
      </div>
      <div class="g-item" data-cat="id" data-full="images/family-four.jpg" data-caption="증명사진 예시">
        <div class="crop" style="background-image:url(images/family-four.jpg);background-size:330%;background-position:35.8% 11.6%;aspect-ratio:3/4"></div><span class="cap">증명·여권</span>
      </div>
      <div class="g-item" data-cat="family" data-full="images/family-big.jpg" data-caption="조부모님과 손주들">
        <div class="crop" style="background-image:url(images/family-big.jpg);background-size:149%;background-position:62.8% 89.9%;aspect-ratio:970/730"></div><span class="cap">가족사진</span>
      </div>
      <div class="g-item" data-cat="profile" data-full="images/profile-couple.jpg" data-caption="개인 프로필">
        <div class="crop" style="background-image:url(images/profile-couple.jpg);background-size:267%;background-position:28.5% 10.7%;aspect-ratio:3/4"></div><span class="cap">프로필</span>
      </div>
      <div class="g-item" data-cat="id" data-full="images/profile-couple.jpg" data-caption="여권사진 예시">
        <div class="crop" style="background-image:url(images/profile-couple.jpg);background-size:311.7%;background-position:77.4% 24.9%;aspect-ratio:3/4"></div><span class="cap">증명·여권</span>
      </div>
      <div class="g-item" data-cat="family" data-full="images/family-four.jpg" data-caption="남매 사진">
        <div class="crop" style="background-image:url(images/family-four.jpg);background-size:149.6%;background-position:61.8% 64.3%;aspect-ratio:4/3"></div><span class="cap">가족사진</span>
      </div>
      <div class="g-item" data-cat="id" data-full="images/family-four.jpg" data-caption="어린이 여권사진 예시">
        <div class="crop" style="background-image:url(images/family-four.jpg);background-size:374%;background-position:69.3% 57.9%;aspect-ratio:3/4"></div><span class="cap">증명·여권</span>
      </div>
    </div>
  </div>
</section>

<section class="cta">
  <img src="images/family-big.jpg" alt="" loading="lazy">
  <div class="container">
    <h2>마음에 드는 사진이 있으셨나요?</h2>
    <p>원하시는 느낌의 사진을 보여주시면 그대로 준비해 드립니다.</p>
    <div class="btn-group">
      <a class="btn btn-primary" href="contact.html#reserve">예약·문의하기</a>
      <a class="btn btn-kakao" data-link="kakao" href="#">💬 카카오톡 상담</a>
    </div>
  </div>
</section>

<div data-footer></div>
<script src="js/site.js"></script>
</body>
</html>
